name: Shared conformance

# Routine checking is local: .githooks/pre-push runs make check on the tip of
# every pushed branch or tag. Request this explicitly for hosted macOS coverage.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: make check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.27'
      - name: Install Gitleaks
        # Gitleaks needs a newer Go than go.mod pins; name the toolchain explicitly.
        run: GOTOOLCHAIN=go1.25.4 go install github.com/zricethezav/gitleaks/v8@v8.30.0 && echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Fetch the pinned dependency-graph checker
        uses: actions/checkout@v4
        with:
          repository: rawwerks/true-up
          ref: 527b3b81fc555d48730392cad41d388d5f6fbe0c # 0.2.1, not published to npm
          path: .build/true-up
          persist-credentials: false
      - name: Run the single gate
        env:
          UV_EXCLUDE_NEWER: '3 days'
        run: |
          test "$(.build/true-up/bin/true-up --version)" = 'true-up 0.2.1'
          make setup-dev check TRUE_UP="$GITHUB_WORKSPACE/.build/true-up/bin/true-up" NODE="$(command -v node)"
